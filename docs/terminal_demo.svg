<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" height="100%" style="background: #09090b; border-radius: 20px; font-family: 'SF Mono', 'JetBrains Mono', Monaco, Menlo, Consolas, monospace;">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>

    <filter id="termShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    .cursor-blink { animation: cursorBlink 0.9s infinite; }
    @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .pulse-alert { animation: pulseAlert 2s infinite ease-in-out; }
    @keyframes pulseAlert { 0%, 100% { fill: #ff453a; } 50% { fill: #ff9f0a; } }
  </style>

  <!-- Terminal Window Base -->
  <rect width="880" height="400" rx="20" fill="url(#termGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" filter="url(#termShadow)"/>

  <!-- macOS Top Window Titlebar -->
  <rect width="880" height="44" rx="20" fill="rgba(255, 255, 255, 0.04)"/>
  <line x1="0" y1="44" x2="880" y2="44" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Traffic Lights -->
  <circle cx="26" cy="22" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="46" cy="22" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="66" cy="22" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Title -->
  <text x="440" y="27" text-anchor="middle" fill="#86868b" font-size="12" font-weight="600">soc-analyst@mail-sentinel-node-01: ~ (zsh)</text>

  <!-- Terminal Body Content -->
  <g font-size="12.5">
    
    <!-- Line 1: Command Execution -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.2s" fill="freeze" />
      <text x="30" y="85" fill="#30d158" font-weight="700">➜</text>
      <text x="48" y="85" fill="#0a84ff" font-weight="700">~/mail-sentinel</text>
      <text x="175" y="85" fill="#ffffff">python -m app.triage --scan sample_phish.eml --explain</text>
    </g>

    <!-- Line 2: Engine Boot Info -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.6s" fill="freeze" />
      <text x="30" y="112" fill="#86868b">[INFO]</text>
      <text x="85" y="112" fill="#ffffff">Initializing Mail Sentinel Air-Gap Triage Pipeline...</text>
      <text x="570" y="112" fill="#30d158">[ZERO-CLOUD-EGRESS]</text>
    </g>

    <!-- Line 3: Engine Ingestion Check -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.0s" fill="freeze" />
      <text x="30" y="139" fill="#0a84ff">●</text>
      <text x="48" y="139" fill="#ffffff">RFC 5322 MIME Parser:</text>
      <text x="240" y="139" fill="#30d158">OK</text>
      <text x="270" y="139" fill="#86868b">(Subject: "URGENT: Executive Wire Transfer Required", Size: 48.2 KB)</text>
    </g>

    <!-- Line 4: SPF / DKIM Result -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.4s" fill="freeze" />
      <text x="30" y="166" fill="#ff453a">▲</text>
      <text x="48" y="166" fill="#ffffff">Authentication Engine:</text>
      <text x="240" y="166" fill="#ff453a" font-weight="700">SPF FAIL</text>
      <text x="320" y="166" fill="#ff453a" font-weight="700">DMARC FAIL</text>
      <text x="420" y="166" fill="#86868b">(Sender domain spoofed: return-path mismatch)</text>
    </g>

    <!-- Line 5: Lexical & URL Triggers -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.8s" fill="freeze" />
      <text x="30" y="193" fill="#ff9f0a">▲</text>
      <text x="48" y="193" fill="#ffffff">Lexical &amp; Link Intel:</text>
      <text x="240" y="193" fill="#ff9f0a">Raw IP URL Host detected</text>
      <text x="450" y="193" fill="#86868b">(http://185.220.101.5/login-auth/)</text>
    </g>

    <!-- Line 6: Local ML Classification -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.2s" fill="freeze" />
      <text x="30" y="220" fill="#30d158">●</text>
      <text x="48" y="220" fill="#ffffff">Local Naive Bayes ML:</text>
      <text x="240" y="220" fill="#ff453a" font-weight="700">Phishing Probability: 99.82%</text>
      <text x="500" y="220" fill="#86868b">(Latency: 8.4ms)</text>
    </g>

    <!-- Divider Line -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.5s" fill="freeze" />
      <line x1="30" y1="238" x2="850" y2="238" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    </g>

    <!-- Verdict Card -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.8s" fill="freeze" />
      <rect x="30" y="250" width="820" height="60" rx="10" fill="rgba(255, 69, 58, 0.12)" stroke="rgba(255, 69, 58, 0.3)" stroke-width="1"/>
      <text x="48" y="275" fill="#ff453a" font-size="14" font-weight="800" class="pulse-alert">🚨 FINAL VERDICT: CRITICAL THREAT</text>
      <text x="350" y="275" fill="#ffffff" font-size="13" font-weight="700">Risk Score: 94/100</text>
      <text x="520" y="275" fill="#86868b" font-size="12">Confidence: 99.1%</text>
      <text x="670" y="275" fill="#30d158" font-size="11" font-weight="600">[Action: Quarantine]</text>
      <text x="48" y="296" fill="#ff9f0a" font-size="11.5">Playbook: 1. Purge email from Exchange • 2. Block domain in gateway • 3. Revoke active JWT session</text>
    </g>

    <!-- Final Prompt & Cursor -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="3.2s" fill="freeze" />
      <text x="30" y="345" fill="#30d158" font-weight="700">➜</text>
      <text x="48" y="345" fill="#0a84ff" font-weight="700">~/mail-sentinel</text>
      <rect x="175" y="333" width="8" height="15" fill="#0a84ff" class="cursor-blink"/>
    </g>

  </g>
</svg>
