<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%" style="background: #09090b; border-radius: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f14"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5e5ce6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30d158" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#64d2ff" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff453a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff9f0a" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .flow-line {
      stroke-dasharray: 8 6;
      animation: flowDash 1.2s linear infinite;
    }
    @keyframes flowDash {
      to {
        stroke-dashoffset: -28;
      }
    }
    
    .pulse-node {
      animation: pulseGlow 2.5s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.03); opacity: 1; filter: drop-shadow(0 0 10px rgba(10, 132, 255, 0.6)); }
    }

    .pulse-danger {
      animation: pulseRed 2s ease-in-out infinite;
    }
    @keyframes pulseRed {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(255, 69, 58, 0.3)); }
      50% { transform: scale(1.02); filter: drop-shadow(0 0 14px rgba(255, 69, 58, 0.8)); }
    }

    .packet-dot {
      animation: movePacket 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes movePacket {
      0% { cx: 160; cy: 140; opacity: 0; }
      15% { opacity: 1; }
      45% { cx: 340; cy: 140; }
      85% { cx: 680; cy: 140; opacity: 1; }
      100% { cx: 720; cy: 140; opacity: 0; }
    }

    .live-badge {
      animation: blinkDot 1.6s ease-in-out infinite;
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>

  <!-- Background Base with border -->
  <rect width="880" height="280" rx="20" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.5">
    <line x1="40" y1="40" x2="840" y2="40" />
    <line x1="40" y1="140" x2="840" y2="140" />
    <line x1="40" y1="240" x2="840" y2="240" />
    <line x1="180" y1="20" x2="180" y2="260" />
    <line x1="360" y1="20" x2="360" y2="260" />
    <line x1="540" y1="20" x2="540" y2="260" />
    <line x1="720" y1="20" x2="720" y2="260" />
  </g>

  <!-- Title & Status Header -->
  <text x="36" y="38" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="-0.02em">MAIL SENTINEL • 6-PILLAR DETECTION PIPELINE</text>
  <circle cx="810" cy="34" r="4" fill="#30d158" class="live-badge" />
  <text x="822" y="38" fill="#30d158" font-size="11" font-weight="600" letter-spacing="0.05em">LIVE PIPELINE</text>

  <!-- Connecting Animated Flow Lines -->
  <!-- Step 1 to Engine Hub -->
  <path d="M 180 140 L 330 75" fill="none" stroke="#0a84ff" stroke-width="2" class="flow-line" opacity="0.7"/>
  <path d="M 180 140 L 330 115" fill="none" stroke="#5e5ce6" stroke-width="2" class="flow-line" opacity="0.7"/>
  <path d="M 180 140 L 330 155" fill="none" stroke="#ff9f0a" stroke-width="2" class="flow-line" opacity="0.7"/>
  <path d="M 180 140 L 330 195" fill="none" stroke="#30d158" stroke-width="2" class="flow-line" opacity="0.7"/>

  <!-- Engine Hub to Synthesis -->
  <path d="M 520 75 L 670 140" fill="none" stroke="#0a84ff" stroke-width="2" class="flow-line" opacity="0.7"/>
  <path d="M 520 115 L 670 140" fill="none" stroke="#5e5ce6" stroke-width="2" class="flow-line" opacity="0.7"/>
  <path d="M 520 155 L 670 140" fill="none" stroke="#ff9f0a" stroke-width="2" class="flow-line" opacity="0.7"/>
  <path d="M 520 195 L 670 140" fill="none" stroke="#30d158" stroke-width="2" class="flow-line" opacity="0.7"/>

  <!-- Dynamic Traveling Data Packet -->
  <circle cx="0" cy="0" r="5" fill="#64d2ff" class="packet-dot" filter="url(#glow)"/>

  <!-- NODE 1: Ingestion Card -->
  <g transform="translate(36, 75)" filter="url(#cardShadow)">
    <rect width="144" height="130" rx="16" fill="#141418" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <rect width="144" height="130" rx="16" fill="none" stroke="#0a84ff" stroke-width="1.5" opacity="0.5"/>
    <circle cx="28" cy="28" r="14" fill="rgba(10, 132, 255, 0.15)"/>
    <text x="28" y="33" text-anchor="middle" font-size="13">📥</text>
    <text x="50" y="32" fill="#ffffff" font-size="12" font-weight="700">Email Ingest</text>
    <text x="16" y="66" fill="#86868b" font-size="10">RFC 5322 .EML</text>
    <text x="16" y="82" fill="#86868b" font-size="10">Raw MIME Headers</text>
    <text x="16" y="98" fill="#86868b" font-size="10">Body &amp; Attachments</text>
    <rect x="16" y="108" width="112" height="16" rx="8" fill="rgba(10, 132, 255, 0.15)"/>
    <text x="72" y="119" text-anchor="middle" fill="#0a84ff" font-size="9" font-weight="600">ZERO CLOUD EGRESS</text>
  </g>

  <!-- NODE 2: 6 Detection Engines Center Grid -->
  <!-- Engine 1: Auth -->
  <g transform="translate(330, 58)">
    <rect width="190" height="34" rx="10" fill="#16161b" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <circle cx="16" cy="17" r="7" fill="#0a84ff" opacity="0.2"/>
    <circle cx="16" cy="17" r="3" fill="#0a84ff"/>
    <text x="30" y="21" fill="#ffffff" font-size="11" font-weight="600">SPF / DKIM / DMARC</text>
    <text x="175" y="21" text-anchor="end" fill="#0a84ff" font-size="10" font-weight="700">20%</text>
  </g>

  <!-- Engine 2: Spoof -->
  <g transform="translate(330, 98)">
    <rect width="190" height="34" rx="10" fill="#16161b" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <circle cx="16" cy="17" r="7" fill="#5e5ce6" opacity="0.2"/>
    <circle cx="16" cy="17" r="3" fill="#5e5ce6"/>
    <text x="30" y="21" fill="#ffffff" font-size="11" font-weight="600">Sender Spoof &amp; Typos</text>
    <text x="175" y="21" text-anchor="end" fill="#5e5ce6" font-size="10" font-weight="700">20%</text>
  </g>

  <!-- Engine 3: NLP Urgency -->
  <g transform="translate(330, 138)">
    <rect width="190" height="34" rx="10" fill="#16161b" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <circle cx="16" cy="17" r="7" fill="#ff9f0a" opacity="0.2"/>
    <circle cx="16" cy="17" r="3" fill="#ff9f0a"/>
    <text x="30" y="21" fill="#ffffff" font-size="11" font-weight="600">Lexical Social Eng.</text>
    <text x="175" y="21" text-anchor="end" fill="#ff9f0a" font-size="10" font-weight="700">15%</text>
  </g>

  <!-- Engine 4: Local ML -->
  <g transform="translate(330, 178)">
    <rect width="190" height="34" rx="10" fill="#16161b" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <circle cx="16" cy="17" r="7" fill="#30d158" opacity="0.2"/>
    <circle cx="16" cy="17" r="3" fill="#30d158"/>
    <text x="30" y="21" fill="#ffffff" font-size="11" font-weight="600">Local TF-IDF + ML</text>
    <text x="175" y="21" text-anchor="end" fill="#30d158" font-size="10" font-weight="700">98.3%</text>
  </g>

  <!-- NODE 3: Apple Watch Activity Ring Risk Score Outcome -->
  <g transform="translate(670, 75)" filter="url(#cardShadow)" class="pulse-node">
    <rect width="174" height="130" rx="18" fill="#141418" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <rect width="174" height="130" rx="18" fill="none" stroke="url(#redGlow)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Mini Activity Ring Gauge -->
    <circle cx="44" cy="55" r="26" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="6"/>
    <circle cx="44" cy="55" r="26" fill="none" stroke="#ff453a" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="163" stroke-dashoffset="32" transform="rotate(-90 44 55)"/>
    <text x="44" y="59" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="800">92</text>
    <text x="44" y="70" text-anchor="middle" fill="#ff453a" font-size="8" font-weight="700">/100</text>

    <!-- Score Details -->
    <text x="82" y="44" fill="#ffffff" font-size="11" font-weight="700">Risk Assessment</text>
    <rect x="82" y="52" width="76" height="18" rx="9" fill="rgba(255, 69, 58, 0.2)" stroke="rgba(255, 69, 58, 0.4)" stroke-width="1"/>
    <text x="120" y="64" text-anchor="middle" fill="#ff453a" font-size="9" font-weight="800" letter-spacing="0.05em">CRITICAL</text>
    <text x="82" y="86" fill="#86868b" font-size="9">Confidence: 99.4%</text>
    
    <!-- Playbook CTA -->
    <rect x="14" y="98" width="146" height="20" rx="10" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="87" y="112" text-anchor="middle" fill="#64d2ff" font-size="9" font-weight="600">🛡️ SOC Playbook Triggered</text>
  </g>

  <!-- Bottom latency metric -->
  <text x="440" y="255" text-anchor="middle" fill="#86868b" font-size="11">
    ⚡ End-to-End Triage Latency: <tspan fill="#30d158" font-weight="700">&lt; 14ms</tspan> • Local Python &amp; Scikit-Learn Inference
  </text>
</svg>
