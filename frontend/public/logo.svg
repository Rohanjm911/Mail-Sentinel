<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldBorder" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shieldBg" x1="12" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161f30"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="sentinelGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Protective Outer Sentinel Shield -->
  <path d="M32 4L11 13.5V30C11 44 20 54 32 59.5C44 54 53 44 53 30V13.5L32 4Z" 
        fill="url(#shieldBg)" 
        stroke="url(#shieldBorder)" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#sentinelGlow)"/>

  <!-- Mail Envelope Body -->
  <rect x="19" y="24" width="26" height="18" rx="2.5" 
        fill="#0d1424" 
        stroke="#38bdf8" 
        stroke-width="2.2" 
        stroke-linejoin="round"/>
  
  <!-- Envelope Flap Crease -->
  <path d="M20 25L32 34.5L44 25" 
        stroke="#38bdf8" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Radar Scanner / Sentinel Core -->
  <circle cx="32" cy="33.5" r="4.5" fill="#10b981" />
  <circle cx="32" cy="33.5" r="7.5" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2.5 2"/>
</svg>
